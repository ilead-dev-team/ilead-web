name: Program scheduler tick
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scheduler-job-tick
  cancel-in-progress: false
jobs:
  tick:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false && vars.ENABLE_JOB_TICK == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Invoke protected job tick
        env:
          JOB_TICK_URL: ${{ secrets.JOB_TICK_URL }}
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
        run: node scripts/invoke-job-tick.mjs
