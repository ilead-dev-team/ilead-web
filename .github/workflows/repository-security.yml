name: Repository security
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  repository-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Check for concealed scripts and automatic execution
        run: python scripts/check-repository-security.py
      - name: Test security guard with synthetic fixtures
        run: python scripts/test-repository-security.py
